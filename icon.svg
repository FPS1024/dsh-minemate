<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges" role="img" aria-label="Alex, the Minecraft companion">
  <rect width="64" height="64" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- hair silhouette -->
  <rect x="12" y="8" width="40" height="10" fill="#c56a2b"/>
  <rect x="8" y="14" width="10" height="30" fill="#c56a2b"/>
  <rect x="46" y="14" width="10" height="30" fill="#c56a2b"/>
  <rect x="10" y="10" width="8" height="6" fill="#e08a45"/>
  <rect x="46" y="10" width="8" height="6" fill="#e08a45"/>
  <rect x="8" y="34" width="10" height="10" fill="#9c4f1f"/>
  <rect x="46" y="34" width="10" height="10" fill="#9c4f1f"/>

  <!-- face -->
  <rect x="16" y="18" width="32" height="28" fill="#f3c9a3"/>
  <rect x="16" y="18" width="32" height="8" fill="#c56a2b"/>
  <rect x="16" y="26" width="6" height="7" fill="#c56a2b"/>
  <rect x="42" y="26" width="6" height="7" fill="#c56a2b"/>
  <rect x="16" y="42" width="32" height="4" fill="#d9a77d"/>

  <!-- eyes -->
  <rect x="21" y="30" width="8" height="6" fill="#f7f7f7"/>
  <rect x="35" y="30" width="8" height="6" fill="#f7f7f7"/>
  <rect x="24" y="31" width="5" height="4" fill="#3f7f3a"/>
  <rect x="36" y="31" width="5" height="4" fill="#3f7f3a"/>
  <rect x="25" y="32" width="2" height="2" fill="#16351a"/>
  <rect x="37" y="32" width="2" height="2" fill="#16351a"/>

  <!-- nose and mouth -->
  <rect x="30" y="36" width="4" height="4" fill="#d9a77d"/>
  <rect x="27" y="42" width="10" height="2" fill="#8a4b3a"/>

  <!-- shirt -->
  <rect x="18" y="48" width="28" height="10" fill="#5fa88f"/>
  <rect x="26" y="48" width="12" height="10" fill="#7cc4a8"/>
  <rect x="18" y="58" width="28" height="4" fill="#3f7f6a"/>
</svg>
