# MineMate DSH bundle layer.
#
# Installed use (the DSH host supplies @deepseek-ai/* at runtime):
#   dsh plugin --profile tui add github:FPS1024/dsh-minemate
#   dsh tui
#
# Local development:
#   ./scripts/dsh-dev.sh
#
# The config keeps the Minecraft server and player parameters from the old
# MineMate config. The harness owns the brain; this layer owns the body.
- insert:
    - id: dsh-minemate
      name: '@fps1024/dsh-minemate'
      config:
        host: 127.0.0.1
        port: 25565
        username: Alex
        auth: offline
        version: '1.21.6'
        owner: FPS1024
        companionName: Alex
        autoConnect: true
        reconnect: true
        # Reflexes run without the model: eat, flee, defend, avoid lava, sleep.
        reflex: true
        # Body language and human latency.
        humanize: true
        humanizeChat: true
        reactionDelayMs: 150
        gaze: true
        gait: true
        autoDefend: true
        avoidLava: true
        autoSleep: true
        # 0 disables unprompted life turns; 60 is curious but not frantic.
        autonomy: 60
        proactiveIntervalMs: 45000
        # Set this to a DSH session id to pin one agent. Empty = the single
        # root agent in the profile.
        agentSessionId: ''
