# MineMate DSH bundle layer.
#
# Installed use (the DSH host supplies @deepseek-ai/* at runtime):
#   dsh plugin --profile tui add github:FPS1024/dsh-minemate
#   dsh tui
#
# Local development:
#   ./scripts/dsh-dev.sh
#
# The config keeps the Minecraft server and player parameters from the old
# MineMate config. The harness owns the brain; this layer owns the body.
- insert:
    - id: dsh-minemate
      name: '@fps1024/dsh-minemate'
      config:
        host: 127.0.0.1
        port: 25565
        username: Alex
        auth: offline
        version: '1.21.6'
        owner: FPS1024
        companionName: Alex
        autoConnect: true
        reconnect: true
        # Reflexes run without the model: eat, flee, defend, avoid lava, sleep.
        reflex: true
        # Body language and human latency.
        humanize: true
        humanizeChat: true
        reactionDelayMs: 150
        gaze: true
        gait: true
        autoDefend: true
        avoidLava: true
        autoSleep: true
        # Off by default: unprompted life turns made the owner's first message
        # wait behind tool loops. Turn it up deliberately if you want them.
        autonomy: 0
        proactiveIntervalMs: 180000
        # Other players' chat is ambient noise unless explicitly enabled.
        ambientChat: false
        # Set this to a DSH session id to pin one agent. Empty = the single
        # root agent in the profile.
        agentSessionId: ''
